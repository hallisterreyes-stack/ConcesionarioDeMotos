<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoDrive - Panel de Gestión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Panel de Gestión - MotoDrive</h1>
    </header>

    <main>
        
        <section class="panel-captura">
            <h2>Registrar Motocicleta</h2>
            <form id="moto-form">
                <div class="grupo-input">
                    <label for="modelo">Modelo de la Moto:</label>
                    <input type="text" id="modelo" placeholder="Ej. Yamaha R6" required>
                </div>
                <div class="grupo-input">
                    <label for="precio">Precio Base ($):</label>
                    <input type="number" id="precio" placeholder="Ej. 15000" min="1" required>
                </div>
                <button type="submit">Agregar al Inventario</button>
            </form>
        </section>

        <section class="panel-metricas">
            <h2>Estadísticas en Tiempo Real</h2>
            <div class="metricas-grid">
                <div class="metrica-card">
                    <h3>Total de Motos</h3>
                    <p id="total-motos">0</p>
                </div>
                <div class="metrica-card">
                    <h3>Valor de Inversión</h3>
                    <p>$<span id="valor-inversion">0.00</span></p>
                </div>
            </div>
        </section>

        <section class="panel-inventario">
            <h2>Inventario Actual</h2>
            <div id="inventario-container"></div>
        </section>

    </main>

    <script type="module" src="main.js"></script>

</body>
</html>
